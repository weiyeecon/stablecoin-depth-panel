name: daily-depth-snapshot

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'exact_l2_config.csv'
      - 'requirements.txt'
      - 'scripts/commit_collected_data.sh'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: depth-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test native book adapters and provenance
        id: tests
        run: |
          python test_depth_logic.py
          python -m unittest discover -p 'test_*.py' -v

      - name: Collect native L2 books
        id: native
        # Failure stays red, but the steps below still archive partial results.
        run: python collect_exact_l2.py

      - name: Preserve this native attempt before Git push
        if: ${{ !cancelled() && steps.native.outputs.snapshot_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-l2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native.outputs.snapshot_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build separate native L2 panels
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python build_exact_l2_panel.py

      - name: Commit native data and coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: bash scripts/commit_collected_data.sh

      - name: Collect CoinGecko proxy snapshot
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }}
        run: python collect_snapshot.py

      - name: Commit proxy snapshot
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: bash scripts/commit_collected_data.sh
